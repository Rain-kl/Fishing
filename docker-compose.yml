services:
  fishing:
    image: ${FISHING_IMAGE:-ghcr.io/rain-kl/fishing:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fishing-honeypot
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
      # 非 root 容器仅能监听 1024 及以上非特权端口；如需对外暴露标准 22 端口，
      # 可直接通过宿主机端口映射转发至容器内部端口（例如 "22:2222"）。
      - "2222-2232:2222-2232"
    volumes:
      # 默认使用命名卷自动继承容器 /data (10001:10001) 权限；
      # 若需绑定宿主机目录 ./data:/data，请在 Linux 宿主机先执行:
      # mkdir -p ./data && chown -R 10001:10001 ./data
      - fishing-data:/data
    environment:
      FISHING_ADDR: ":8080"
      FISHING_DATA_DIR: "/data"
      FISHING_BIND_HOST: "0.0.0.0"

volumes:
  fishing-data:
