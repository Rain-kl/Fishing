name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build Binaries & Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Determine release version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run tests before release
        run: go test -race -count=1 ./...

      - name: Cross-compile release archives
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p dist
          targets=(
            "linux amd64"
            "linux arm64"
            "darwin amd64"
            "darwin arm64"
            "windows amd64"
          )
          for target in "${targets[@]}"; do
            read -r goos goarch <<< "$target"
            bin="fishing"
            if [ "$goos" = "windows" ]; then
              bin="fishing.exe"
            fi
            out_dir="dist/fishing-${VERSION}-${goos}-${goarch}"
            mkdir -p "$out_dir"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${out_dir}/${bin}" .
            cp README.md docker-compose.yml "$out_dir/"
            if [ "$goos" = "windows" ]; then
              (cd dist && zip -rq "fishing-${VERSION}-${goos}-${goarch}.zip" "fishing-${VERSION}-${goos}-${goarch}")
            else
              tar -C dist -czf "dist/fishing-${VERSION}-${goos}-${goarch}.tar.gz" "fishing-${VERSION}-${goos}-${goarch}"
            fi
            rm -rf "$out_dir"
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/*

  docker:
    name: Build & Push Multi-Arch Alpine Image to GHCR (No QEMU)
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize GHCR image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version == '' }}

      - name: Build and push multi-arch Alpine image without QEMU
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
